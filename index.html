<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>낱말 관계 카드 뒤집기</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --syn:  #10b981;
            --ant:  #ef4444;
            --inc:  #3b82f6;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 55%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* ─── Screens ─── */
        .screen {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            animation: fadeUp .45s ease;
        }
        .screen.active { display: flex; }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ─── START SCREEN ─── */
        .start-title {
            font-size: clamp(26px, 5vw, 46px);
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #f093fb, #f5576c, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }
        .start-sub {
            font-size: 15px;
            opacity: .65;
            text-align: center;
            margin-bottom: 32px;
        }
        .glass-card {
            background: rgba(255,255,255,.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 22px;
            padding: 36px;
            width: 100%;
            max-width: 460px;
        }
        .rules h3 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .rule-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .rule-row.syn { background: rgba(16,185,129,.18); border:1px solid rgba(16,185,129,.35); }
        .rule-row.ant { background: rgba(239,68,68,.18);  border:1px solid rgba(239,68,68,.35); }
        .rule-row.inc { background: rgba(59,130,246,.18); border:1px solid rgba(59,130,246,.35); }
        .rule-badge {
            padding: 3px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            color: #fff;
        }
        .syn .rule-badge { background: var(--syn); }
        .ant .rule-badge { background: var(--ant); }
        .inc .rule-badge { background: var(--inc); }

        .field { margin: 24px 0 20px; }
        .field label { display:block; font-size:13px; opacity:.7; margin-bottom:8px; }
        .field input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.09);
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color .25s;
        }
        .field input:focus { border-color: rgba(255,255,255,.5); }
        .field input::placeholder { color: rgba(255,255,255,.35); }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 13px;
            font-size: 17px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-main  { background: linear-gradient(135deg,#f093fb,#f5576c); color:#fff; }
        .btn-main:hover  { box-shadow: 0 8px 25px rgba(240,147,251,.4); }
        .btn-ghost { background: rgba(255,255,255,.13); color:#fff; border:1px solid rgba(255,255,255,.2); }
        .btn-ghost:hover { background: rgba(255,255,255,.22); }
        .btn-end   { background: linear-gradient(135deg,#f5576c,#f093fb); color:#fff; }
        .btn-end:hover   { box-shadow: 0 8px 25px rgba(245,87,108,.4); }
        .btn-row   { display:flex; gap:12px; }
        .btn-row .btn { flex:1; }

        /* ─── GAME SCREEN ─── */
        .game-header {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 840px;
        }
        .stat-box {
            background: rgba(255,255,255,.09);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.13);
            border-radius: 14px;
            padding: 10px 22px;
            text-align: center;
            min-width: 110px;
        }
        .stat-lbl { font-size:10px; opacity:.55; text-transform:uppercase; letter-spacing:1px; margin-bottom:2px; }
        .stat-val { font-size:26px; font-weight:900; }
        .c-score  { color:#fbbf24; }
        .c-timer  { color:#60a5fa; }
        .c-pairs  { color:#34d399; }

        .legend {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .leg-chip {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }
        .leg-chip.syn { background: var(--syn); }
        .leg-chip.ant { background: var(--ant); }
        .leg-chip.inc { background: var(--inc); }

        /* ─── Card Grid ─── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 840px;
        }
        @media (max-width: 580px) {
            .card-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .card { aspect-ratio: 4/3; perspective: 800px; cursor: pointer; }
        .card.matched, .card.locked-out { cursor: default; }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform .5s cubic-bezier(.175,.885,.32,1.275);
        }
        .card.flipped .card-inner,
        .card.matched .card-inner { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* Back (face-down) */
        .card-b {
            background: linear-gradient(135deg, #2d1b69, #11998e);
            border: 2px solid rgba(255,255,255,.15);
            box-shadow: 0 4px 14px rgba(0,0,0,.35);
            font-size: 28px;
            font-weight: 900;
            color: rgba(255,255,255,.4);
            letter-spacing: 2px;
        }

        /* Front (face-up) */
        .card-f {
            background: #fff;
            transform: rotateY(180deg);
            box-shadow: 0 4px 14px rgba(0,0,0,.2);
            flex-direction: column;
            gap: 5px;
        }
        .card-word {
            font-size: clamp(12px, 1.8vw, 18px);
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            padding: 0 6px;
            line-height: 1.3;
        }
        .card-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
            color: #fff;
            opacity: 0;
            transition: opacity .3s;
        }
        .card.matched .card-badge { opacity: 1; }

        /* Matched colour themes */
        .card.matched.syn .card-f  { background: linear-gradient(135deg,#d1fae5,#a7f3d0); }
        .card.matched.syn .card-badge { background: var(--syn); }
        .card.matched.ant .card-f  { background: linear-gradient(135deg,#fee2e2,#fecaca); }
        .card.matched.ant .card-badge { background: var(--ant); }
        .card.matched.inc .card-f  { background: linear-gradient(135deg,#dbeafe,#bfdbfe); }
        .card.matched.inc .card-badge { background: var(--inc); }

        /* Wrong shake */
        @keyframes shake {
            0%,100% { transform:translateX(0); }
            20%      { transform:translateX(-7px); }
            40%      { transform:translateX(7px); }
            60%      { transform:translateX(-4px); }
            80%      { transform:translateX(4px); }
        }
        .card.wrong { animation: shake .5s ease; }
        .card.wrong .card-f { background: linear-gradient(135deg,#fef3c7,#fde68a) !important; }

        /* Score popup */
        .score-pop {
            position: fixed;
            font-size: 22px;
            font-weight: 900;
            color: #fbbf24;
            pointer-events: none;
            animation: popFloat 1s ease forwards;
            z-index: 999;
            text-shadow: 0 2px 8px rgba(0,0,0,.4);
        }
        @keyframes popFloat {
            0%   { opacity:1; transform:translateY(0) scale(1); }
            100% { opacity:0; transform:translateY(-70px) scale(1.4); }
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-90px);
            color: #fff;
            padding: 11px 26px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            z-index: 100;
            transition: transform .4s cubic-bezier(.175,.885,.32,1.275);
            box-shadow: 0 4px 20px rgba(0,0,0,.35);
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ─── END SCREEN ─── */
        .end-title {
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 900;
            background: linear-gradient(135deg,#fbbf24,#f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .end-player { opacity:.65; font-size:15px; margin-bottom:8px; }
        .end-score { font-size: clamp(52px,9vw,76px); font-weight:900; color:#fbbf24; margin:8px 0; }
        .end-meta  { display:flex; gap:20px; opacity:.6; font-size:14px; margin-bottom:28px; }

        .rank-title { font-size:17px; font-weight:700; margin-bottom:14px; }
        .rank-list  { list-style:none; margin-bottom:28px; }
        .rank-row {
            display:flex;
            align-items:center;
            gap:12px;
            padding:9px 14px;
            border-radius:11px;
            margin-bottom:6px;
            font-size:14px;
        }
        .rank-row:nth-child(1)   { background:rgba(251,191,36,.2); }
        .rank-row:nth-child(2)   { background:rgba(156,163,175,.18); }
        .rank-row:nth-child(3)   { background:rgba(180,83,9,.18); }
        .rank-row:nth-child(n+4) { background:rgba(255,255,255,.06); }
        .rank-num {
            width:26px; height:26px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-weight:900; font-size:12px; flex-shrink:0;
        }
        .rank-row:nth-child(1) .rank-num { background:#fbbf24; color:#1e293b; }
        .rank-row:nth-child(2) .rank-num { background:#9ca3af; color:#fff; }
        .rank-row:nth-child(3) .rank-num { background:#b45309; color:#fff; }
        .rank-row:nth-child(n+4) .rank-num { background:rgba(255,255,255,.2); }
        .rank-name { flex:1; text-align:left; font-weight:600; }
        .rank-time { opacity:.45; font-size:11px; }
        .rank-pts  { font-weight:900; color:#fbbf24; }
        .rank-row.me { outline: 2px solid #f093fb; }

        /* Confetti */
        .conf {
            position:fixed; border-radius:50%;
            pointer-events:none;
            animation: confFall linear forwards;
        }
        @keyframes confFall {
            from { opacity:1; transform:translateY(-20px) rotate(0deg); }
            to   { opacity:0; transform:translateY(105vh) rotate(720deg); }
        }
    </style>
</head>
<body>

<!-- ══════════════ START ══════════════ -->
<div id="scr-start" class="screen active">
    <h1 class="start-title">낱말 관계 카드 뒤집기 🃏</h1>
    <p class="start-sub">두 카드를 뒤집어 낱말 관계를 맞춰보세요!</p>
    <div class="glass-card">
        <div class="rules">
            <h3>📖 낱말 관계 유형</h3>
            <div class="rule-row syn">
                <span class="rule-badge">유의어</span>
                <span>뜻이 비슷한 낱말 — 4쌍</span>
            </div>
            <div class="rule-row ant">
                <span class="rule-badge">반의어</span>
                <span>뜻이 반대인 낱말 — 4쌍</span>
            </div>
            <div class="rule-row inc">
                <span class="rule-badge">포함관계</span>
                <span>뜻에 포함되는 낱말 — 4쌍</span>
            </div>
        </div>
        <div class="field">
            <label>플레이어 이름</label>
            <input id="inp-name" type="text" placeholder="이름을 입력하세요" maxlength="10" />
        </div>
        <button class="btn btn-main" onclick="startGame()">🎮 게임 시작!</button>
    </div>
</div>

<!-- ══════════════ GAME ══════════════ -->
<div id="scr-game" class="screen">
    <div class="game-header">
        <div class="stat-box">
            <div class="stat-lbl">점수</div>
            <div class="stat-val c-score" id="disp-score">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-lbl">남은 쌍</div>
            <div class="stat-val c-pairs" id="disp-pairs">12</div>
        </div>
        <div class="stat-box">
            <div class="stat-lbl">경과 시간</div>
            <div class="stat-val c-timer" id="disp-timer">00:00</div>
        </div>
    </div>
    <div class="legend">
        <span class="leg-chip syn">🌿 유의어</span>
        <span class="leg-chip ant">🔥 반의어</span>
        <span class="leg-chip inc">💧 포함관계</span>
    </div>
    <div id="card-grid" class="card-grid"></div>
</div>

<!-- ══════════════ END ══════════════ -->
<div id="scr-end" class="screen">
    <div class="glass-card" style="max-width:500px;text-align:center;">
        <div class="end-title">🎉 게임 완료!</div>
        <div class="end-player" id="end-name"></div>
        <div class="end-score" id="end-score">0</div>
        <div class="end-meta">
            <span id="end-time">⏱ 00:00</span>
            <span id="end-match">🎯 12/12</span>
        </div>
        <div class="rank-title">🏆 점수 랭킹</div>
        <ul class="rank-list" id="rank-list">
            <li style="opacity:.5;text-align:center;padding:20px;">불러오는 중...</li>
        </ul>
        <div class="btn-row">
            <button class="btn btn-ghost" onclick="restartGame()">🔄 다시하기</button>
            <button class="btn btn-end"   onclick="quitGame()">✕ 종료하기</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
// 점수 저장: localStorage (GitHub Pages 정적 호스팅 대응)
const STORAGE_KEY = 'wordFlipScores';

function lsGetScores(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }
    catch{ return []; }
}
function lsSaveScores(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

const PAIRS = [
    { id:1,  w1:'기쁨',    w2:'즐거움',  type:'syn', lbl:'유의어' },
    { id:2,  w1:'슬픔',    w2:'비탄',    type:'syn', lbl:'유의어' },
    { id:3,  w1:'아름답다',w2:'예쁘다',  type:'syn', lbl:'유의어' },
    { id:4,  w1:'빠르다',  w2:'신속하다',type:'syn', lbl:'유의어' },
    { id:5,  w1:'크다',    w2:'작다',    type:'ant', lbl:'반의어' },
    { id:6,  w1:'밝다',    w2:'어둡다',  type:'ant', lbl:'반의어' },
    { id:7,  w1:'더하다',  w2:'빼다',    type:'ant', lbl:'반의어' },
    { id:8,  w1:'시작',    w2:'끝',      type:'ant', lbl:'반의어' },
    { id:9,  w1:'과일',    w2:'사과',    type:'inc', lbl:'포함관계' },
    { id:10, w1:'동물',    w2:'개',      type:'inc', lbl:'포함관계' },
    { id:11, w1:'꽃',      w2:'장미',    type:'inc', lbl:'포함관계' },
    { id:12, w1:'채소',    w2:'당근',    type:'inc', lbl:'포함관계' },
];

// ── state ──
let player='', score=0, matched=0, elapsed=0;
let flipped=[], locked=false, timerID=null;
let deck=[];
const TOTAL=12;

function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// ─── START ───
function startGame(){
    player = document.getElementById('inp-name').value.trim() || '익명';
    score=0; matched=0; elapsed=0; flipped=[]; locked=false;
    clearInterval(timerID);

    deck = buildDeck();
    renderGrid();

    document.getElementById('disp-score').textContent='0';
    document.getElementById('disp-pairs').textContent=TOTAL;
    document.getElementById('disp-timer').textContent='00:00';

    showScreen('scr-game');

    timerID = setInterval(()=>{
        elapsed++;
        const m=String(Math.floor(elapsed/60)).padStart(2,'0');
        const s=String(elapsed%60).padStart(2,'0');
        document.getElementById('disp-timer').textContent=`${m}:${s}`;
    },1000);
}

function buildDeck(){
    const cards=[];
    PAIRS.forEach(p=>{
        cards.push({pid:p.id, word:p.w1, type:p.type, lbl:p.lbl});
        cards.push({pid:p.id, word:p.w2, type:p.type, lbl:p.lbl});
    });
    for(let i=cards.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [cards[i],cards[j]]=[cards[j],cards[i]];
    }
    return cards;
}

function renderGrid(){
    const g=document.getElementById('card-grid');
    g.innerHTML='';
    deck.forEach((c,i)=>{
        const el=document.createElement('div');
        el.className='card';
        el.dataset.i=i;
        el.innerHTML=`
            <div class="card-inner">
                <div class="card-face card-b">?</div>
                <div class="card-face card-f">
                    <div class="card-word">${c.word}</div>
                    <div class="card-badge">${c.lbl}</div>
                </div>
            </div>`;
        el.addEventListener('click',()=>flip(el,i));
        g.appendChild(el);
    });
}

// ─── FLIP ───
function flip(el,i){
    if(locked||el.classList.contains('flipped')||el.classList.contains('matched')) return;
    if(flipped.length>=2) return;

    el.classList.add('flipped');
    flipped.push({el,i});

    if(flipped.length===2){
        locked=true;
        setTimeout(check, 900);
    }
}

function check(){
    const [a,b]=flipped;
    flipped=[];
    const ca=deck[a.i], cb=deck[b.i];

    if(ca.pid===cb.pid){
        // ✅ match
        score+=10;
        matched++;
        a.el.classList.add('matched',ca.type);
        b.el.classList.add('matched',cb.type);
        document.getElementById('disp-score').textContent=score;
        document.getElementById('disp-pairs').textContent=TOTAL-matched;
        scorePopup(a.el,'+10');
        toast(`✨ ${ca.lbl} 매치! +10점`, ca.type);
        locked=false;
        if(matched===TOTAL) setTimeout(endGame,700);
    } else {
        // ❌ wrong
        a.el.classList.add('wrong');
        b.el.classList.add('wrong');
        setTimeout(()=>{
            a.el.classList.remove('flipped','wrong');
            b.el.classList.remove('flipped','wrong');
            locked=false;
        },650);
    }
}

// ─── UI helpers ───
function scorePopup(anchor,txt){
    const r=anchor.getBoundingClientRect();
    const p=document.createElement('div');
    p.className='score-pop';
    p.textContent=txt;
    p.style.left=`${r.left+r.width/2-16}px`;
    p.style.top=`${r.top+window.scrollY}px`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1000);
}

let toastTimer;
function toast(msg,type){
    const el=document.getElementById('toast');
    const bg={syn:'#10b981',ant:'#ef4444',inc:'#3b82f6'};
    el.style.background=bg[type]||'#10b981';
    el.textContent=msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

// ─── END ───
function endGame(){
    clearInterval(timerID);
    saveScore();

    document.getElementById('end-name').textContent=`${player} 님의 점수`;
    document.getElementById('end-score').textContent=score;
    const m=String(Math.floor(elapsed/60)).padStart(2,'0');
    const s=String(elapsed%60).padStart(2,'0');
    document.getElementById('end-time').textContent=`⏱ ${m}:${s}`;
    document.getElementById('end-match').textContent=`🎯 ${matched}/${TOTAL}`;

    loadRanking();
    showScreen('scr-end');
    confetti();
}

function saveScore(){
    const list = lsGetScores();
    list.push({
        name:  player,
        score: score,
        time:  elapsed,
        date:  new Date().toLocaleDateString('ko-KR')
    });
    list.sort((a,b)=>b.score-a.score||a.time-b.time);
    lsSaveScores(list.slice(0,50)); // 최대 50개 보관
}

function loadRanking(){
    const ul = document.getElementById('rank-list');
    const list = lsGetScores().slice(0,10);
    if(!list.length){
        ul.innerHTML='<li style="opacity:.5;text-align:center;padding:18px;">아직 기록이 없습니다</li>';
        return;
    }
    ul.innerHTML=list.map((r,i)=>{
        const isMe=r.name===player&&r.score===score&&r.time===elapsed;
        const ts=`${String(Math.floor(r.time/60)).padStart(2,'0')}:${String(r.time%60).padStart(2,'0')}`;
        const medal=['🥇','🥈','🥉'][i]||`${i+1}`;
        return `<li class="rank-row${isMe?' me':''}">
            <span class="rank-num">${medal}</span>
            <span class="rank-name">${r.name}</span>
            <span class="rank-time">${ts}</span>
            <span class="rank-pts">${r.score}점</span>
        </li>`;
    }).join('');
}

function restartGame(){
    showScreen('scr-start');
    document.getElementById('inp-name').value='';
}

function quitGame(){
    const r=window.close();
    if(r===undefined){
        document.body.innerHTML=`
        <div style="display:flex;align-items:center;justify-content:center;
                    min-height:100vh;color:#fff;text-align:center;
                    background:linear-gradient(135deg,#1a1a2e,#0f3460);">
            <div>
                <p style="font-size:64px;margin-bottom:20px">👋</p>
                <h2 style="font-size:30px;margin-bottom:12px">감사합니다!</h2>
                <p style="opacity:.6">브라우저 탭을 닫아주세요.</p>
            </div>
        </div>`;
    }
}

function confetti(){
    const colors=['#fbbf24','#f093fb','#f5576c','#10b981','#3b82f6','#a78bfa','#34d399'];
    for(let i=0;i<90;i++){
        const p=document.createElement('div');
        p.className='conf';
        const sz=6+Math.random()*9;
        p.style.cssText=`
            left:${Math.random()*100}vw;
            width:${sz}px;height:${sz}px;
            background:${colors[~~(Math.random()*colors.length)]};
            border-radius:${Math.random()>.4?'50%':'3px'};
            animation-duration:${1.4+Math.random()*2.2}s;
            animation-delay:${Math.random()*.6}s;
        `;
        document.body.appendChild(p);
        setTimeout(()=>p.remove(),3500);
    }
}

// Enter key on name input
document.getElementById('inp-name').addEventListener('keypress',e=>{
    if(e.key==='Enter') startGame();
});
